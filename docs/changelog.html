<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function $(id) { return document.getElementById(id); }

  // Runs come from build_site.py's inline(): plain text, `code` or [text](href).
  function runs(parent, list) {
    list.forEach(function (r) {
      if (r.code !== undefined) parent.appendChild(el("code", { text: r.code }));
      else if (r.href) parent.appendChild(el("a", { href: r.href, text: r.t }));
      else parent.appendChild(document.createTextNode(r.t));
    });
    return parent;
  }

  $("version").textContent = "v" + D.version;
  $("repo-link").href = D.repo;
  $("source-link").href = D.repo + "/blob/main/CHANGELOG.md";
  $("license").textContent = D.license + " license.";
  runs($("tagline"), D.changelog.intro);

  D.changelog.releases.forEach(function (rel) {
    var id = "r-" + rel.title.toLowerCase();
    var count = rel.groups.reduce(function (n, g) { return n + g.items.length; }, 0);
    $("release-nav").appendChild(el("li", null, [
      el("a", { href: "#" + id }, [document.createTextNode(rel.title), el("span", { class: "count", text: String(count) })])
    ]));
    var section = el("section", { class: "release", id: id }, [el("h2", { text: rel.title })]);
    rel.groups.forEach(function (g) {
      section.appendChild(el("div", { class: "cat-title", text: g.kind }));
      var ul = el("ul", { class: "changes" });
      g.items.forEach(function (item) { ul.appendChild(runs(el("li"), item)); });
      section.appendChild(ul);
    });
    $("releases").appendChild(section);
  });
})();
</script>
